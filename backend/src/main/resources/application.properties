spring.application.name=backend

spring.datasource.url=${SUA_URL_ORACLE}
spring.datasource.username=${SEU_USUARIO_ORACLE}
spring.datasource.password=${SUA_SENHA_ORACLE}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Hibernate: Faz o Java conversar com o padrão SQL do Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave secreta para JWT (substitua por uma chave segura)
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}